<svg xmlns="http://www.w3.org/2000/svg" width="1628" height="810" viewBox="0 0 1628 810" role="img" aria-labelledby="title desc">
  <title id="title">Happy Disco Family preview</title>
  <desc id="desc">Preview of the Happy Disco Family website home screen.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#11090e"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ff82aa" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#ff82aa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#ff82aa" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="1628" height="810" fill="url(#background)"/>
  <circle cx="1180" cy="240" r="330" fill="#ff82aa" opacity="0.13" filter="url(#blur)"/>
  <circle cx="360" cy="760" r="280" fill="#ff82aa" opacity="0.09" filter="url(#blur)"/>
  <rect width="1628" height="810" fill="url(#grid)" opacity="0.5"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M728 108H768M860 108H900" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="814" y="112" text-anchor="middle" fill="#555555" font-size="10" letter-spacing="3">HDF 2026</text>
    <text x="814" y="152" text-anchor="middle" fill="#ff82aa" font-size="13" font-weight="700" letter-spacing="5">WELCOME TO THE FAMILY</text>
    <text x="814" y="294" text-anchor="middle" fill="#ffffff" font-size="143" font-weight="900" letter-spacing="-7">HAPPY</text>
    <text x="814" y="408" text-anchor="middle" fill="transparent" stroke="#b9b9b9" stroke-width="2" font-size="143" font-weight="900" letter-spacing="-7">DISCO</text>
    <text x="814" y="522" text-anchor="middle" fill="#ffffff" font-size="143" font-weight="900" letter-spacing="-7">FAMILY</text>
    <text x="1094" y="337" text-anchor="middle" fill="#ff2d87" font-size="52" letter-spacing="0" transform="rotate(18 1094 337)">🎀</text>
    <text x="814" y="583" text-anchor="middle" fill="#777777" font-size="14" letter-spacing="0.2">Когда-нибудь пытался открыть ящик Пандоры своими руками?</text>

    <text x="814" y="759" text-anchor="middle" fill="#333333" font-size="9" font-weight="700" letter-spacing="3">SCROLL TO EXPLORE</text>
  </g>

</svg>
